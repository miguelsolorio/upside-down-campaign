<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lockdown Art</title>
<meta name="description" content="The art for stage 5.1, Hawkins under lockdown: the dusk town and the army Lab tiles, the army props, the trooper and the Commander, and a street checkpoint scene.">
<style>
  :root {
    color-scheme: dark;
    --ink: #0a0a14; --night: #10142a; --shadow: #1c2340; --dusk: #2c3a63; --slate: #4a5a85;
    --mist: #8190b8; --bone: #d8dce8; --cream: #fff0b0; --amber: #ffb830; --hot: #ff4a4a;
    --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--ink); color: var(--bone); font: 15px/1.5 var(--font); }
  canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 16px 40px; }
  .hero { padding: 28px 0 10px; }
  .kicker { font: 600 12px/1 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--hot); margin: 0 0 12px; }
  h1 { margin: 0 0 10px; font-size: 28px; line-height: 1.1; }
  h2 { margin: 30px 0 4px; font-size: 20px; }
  p { margin: 0 0 8px; max-width: 90ch; }
  .muted { color: var(--mist); }
  .row { display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start; }
  .cell { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
  .cell span { font: 11px/1.2 var(--mono); color: var(--mist); max-width: 160px; }
  .panel { border: 2px solid var(--shadow); background: var(--night); padding: 12px; margin-top: 10px; }
  .trio { display: flex; gap: 6px; }
  .real { display: flex; gap: 10px; align-items: flex-end; padding: 8px; flex-wrap: wrap; }
</style>
</head>
<body>
<header class="hero"><div class="wrap">
  <p class="kicker">Stage 5.1 art review</p>
  <h1>Hawkins under lockdown</h1>
  <p class="muted">Everything on this page is drawn by the game's own pixel code in <code>src/gfx/ch5/</code>.</p>
</div></header>
<main class="wrap" id="main"></main>
<script type="module">
import { buildPage } from '/src/gfx/ch5/lockdown_page.ts';
buildPage(document.getElementById('main'));
</script>
</body>
</html>
