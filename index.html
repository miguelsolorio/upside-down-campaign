<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>Stranger Things 8-bit: The Upside Down Campaign</title>
  <meta name="description" content="An 8-bit Stranger Things fan tribute. Not affiliated with Netflix.">
  <meta name="theme-color" content="#0a0a14">
  <!-- Link previews. social.html draws the card with the game's own art. -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="Stranger Things 8-bit: The Upside Down Campaign">
  <meta property="og:description" content="An 8-bit Stranger Things fan tribute. Not affiliated with Netflix.">
  <meta property="og:image" content="%BASE_URL%social/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Dustin, Mike, Eleven and Lucas on a path into the woods, under the red Stranger Things logo">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="%BASE_URL%social/og.png">
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
    #stage { position: fixed; inset: 0; display: grid; place-items: center; }
    #wrap { position: relative; line-height: 0; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
    #crt { position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.24) 3px);
      box-shadow: inset 0 0 90px rgba(0,0,0,.45); }
    body.scan #crt { opacity: 1; }
    #devpanel { position: fixed; top: 8px; right: 8px; z-index: 9; font: 12px/1.4 monospace; color: #d8dce8;
      background: rgba(10,10,20,.9); border: 1px solid #4a5a85; padding: 8px; display: none; max-width: 260px; }
    #devpanel button { font: inherit; margin: 2px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="stage"><div id="wrap"><canvas id="game" width="256" height="224"></canvas><div id="crt"></div></div></div>
  <div id="devpanel"></div>
  <noscript>This game needs JavaScript.</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
