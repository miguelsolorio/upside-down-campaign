<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Stranger Things 8-bit: The Upside Down Campaign</title>
  <meta name="description" content="An 8-bit Stranger Things fan tribute. Not affiliated with Netflix.">
  <meta name="theme-color" content="#0a0a14">
  <!-- The app icon, a crimson d20. social.html draws these too. -->
  <link rel="icon" href="%BASE_URL%favicon.ico" sizes="16x16 32x32">
  <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png">
  <link rel="manifest" href="%BASE_URL%manifest.webmanifest">
  <meta name="application-name" content="Upside Down">
  <meta name="apple-mobile-web-app-title" content="Upside Down">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <!-- Link previews. social.html draws the card with the game's own art. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Upside Down">
  <meta property="og:url" content="%VITE_SITE_URL%/">

  <meta name="twitter:card" content="summary_large_image">

  <!-- Google Analytics, the same property as miguelsolorio.com and the other games. Skipped on a local server so
       development, tests and the demo recorder don't count as visits. -->
  <script>
    if (!/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {
      const s = document.createElement('script');
      s.async = true;
      s.src = 'https://www.googletagmanager.com/gtag/js?id=G-PDB3DT24E5';
      document.head.appendChild(s);
      window.dataLayer = window.dataLayer || [];
      window.gtag = function () { dataLayer.push(arguments); };
      gtag('js', new Date());
      gtag('config', 'G-PDB3DT24E5');
    }
  </script>
  <style>
    html, body { margin: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
    /* A finger plays the game: no panning, zooming, text selection, callouts or tap flashes. */
    html, body, body * { touch-action: none; -webkit-user-select: none; user-select: none;
      -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    #stage { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; }
    #wrap { position: relative; line-height: 0; }
    /* On a touch screen the layout places the game in the Game Boy's bezel. */
    #stage.touch { display: block; }
    #stage.touch #wrap { position: absolute; }
    canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; background: #000; }
    /* The game is already blown up by a whole number with hard edges, so the browser only smooths the last small
       step to the window's size. Its box must be exactly the drawn image, since clicks are mapped through it. */
    #game { image-rendering: auto; }
    /* The touch screen's Game Boy. It fills the window behind the game, and is clear only past its round corner. */
    #pad { position: fixed; left: 0; top: 0; z-index: 0; display: none; pointer-events: none; background: transparent; }
    #safe { position: fixed; visibility: hidden; pointer-events: none; top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px); bottom: env(safe-area-inset-bottom, 0px); left: env(safe-area-inset-left, 0px); }
    #crt { position: absolute; inset: 0; pointer-events: none; opacity: 0;
      background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 2px, rgba(0,0,0,.24) 3px);
      box-shadow: inset 0 0 90px rgba(0,0,0,.45); }
    body.scan #crt { opacity: 1; }
    #devpanel { position: fixed; top: 8px; right: 8px; z-index: 9; font: 12px/1.4 monospace; color: #d8dce8;
      background: rgba(10,10,20,.9); border: 1px solid #4a5a85; padding: 8px; display: none; max-width: 260px; }
    #devpanel button { font: inherit; margin: 2px; cursor: pointer; }
  </style>
</head>
<body>
  <div id="stage"><div id="wrap"><canvas id="game" width="256" height="224"></canvas><div id="crt"></div></div></div>
  <div id="devpanel"></div>
  <noscript>This game needs JavaScript.</noscript>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
